# Paramount Concrete & Hardscapes — static site (Astro output)
# Serves dist/ with clean URLs, gzip, long-cache assets, security headers.

server {
    listen 80;
    server_name paramountknox.com www.paramountknox.com;
    root /usr/share/nginx/html;
    index index.html;

    # --- gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml font/woff2;

    # --- security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Uncomment once HTTPS is confirmed working (see TLS note in docs):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- redirect www -> apex (optional; enable if you prefer apex canonical) ---
    # if ($host = www.paramountknox.com) { return 301 https://paramountknox.com$request_uri; }

    # --- long cache for fingerprinted assets ---
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- sitemap / robots served directly ---
    location = /robots.txt { access_log off; }
    location = /sitemap-index.xml { access_log off; }

    # --- clean URLs: try file, then directory (index.html), else 404 ---
    location / {
        try_files $uri $uri/ =404;
    }

    # --- custom 404 ---
    error_page 404 /404.html;
    location = /404.html { internal; }

    # --- example 301s to preserve legacy URLs (see docs/seo/redirect-map.md) ---
    # location = /old-path/ { return 301 /new-path/; }
}
