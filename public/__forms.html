<!--
  Netlify Forms detection stub. Netlify scans static HTML at deploy time for
  forms marked with data-netlify. This guarantees the "quote" form (used across
  the site via QuoteForm.astro) is always detected, even though Astro renders
  the real forms dynamically. This page is hidden and unlinked.
-->
<html>
  <head><meta name="robots" content="noindex" /><title>Form detection</title></head>
  <body>
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="address" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <input type="text" name="source" />
      <textarea name="details"></textarea>
      <input name="bot-field" />
    </form>

    <!-- Retaining-wall design offer questionnaire (/retaining-wall-design/) -->
    <form name="wall-design" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="wall-design" />
      <input type="text" name="service" />
      <input type="text" name="source" />
      <input type="text" name="wall_purpose" />
      <input type="text" name="wall_length" />
      <input type="text" name="wall_height" />
      <input type="text" name="wall_material" />
      <input type="checkbox" name="water_issues" />
      <input type="text" name="access" />
      <input type="text" name="hoa" />
      <input type="checkbox" name="add_ons" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <input type="text" name="decision_makers" />
      <textarea name="details"></textarea>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="best_time" />
      <input type="text" name="address" />
      <input type="file" name="photo" />
      <input type="checkbox" name="design_fee_ok" />
      <input name="bot-field" />
    </form>
  </body>
</html>
